# Builds the Windows installer and publishes it as a GitHub Release.
# To ship a new desktop version: bump "version" in package.json, commit, then run this workflow
# (Actions tab → Release → Run workflow). Installed VentaPro apps pick the release up automatically
# and install it when closed.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
      - name: Read version
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # one upload step: installer + blockmap + latest.yml (latest.yml is what installed apps check)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: ${{ steps.v.outputs.version }}
          make_latest: true
          body: VentaPro desktop ${{ steps.v.outputs.version }}. Installed apps update themselves; new PCs can use the installer below.
          files: |
            dist/VentaPro-Setup-${{ steps.v.outputs.version }}.exe
            dist/VentaPro-Setup-${{ steps.v.outputs.version }}.exe.blockmap
            dist/latest.yml

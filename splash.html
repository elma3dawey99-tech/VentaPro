<!doctype html><html><head><meta charset="utf-8"><title>VentaPro</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;color:#EEF2FF;-webkit-user-select:none;-webkit-app-region:drag}
body{background:linear-gradient(160deg,#0D1A30 0%,#0B1528 45%,#0A1F2A 100%)}
/* slow aurora */
.au{position:absolute;border-radius:50%;filter:blur(60px);opacity:0;animation:auIn 2.4s .1s ease-out forwards}
.au1{width:420px;height:300px;left:-120px;top:-90px;background:#1E5A78}
.au2{width:380px;height:280px;right:-110px;bottom:-120px;background:#1F6E66}
.au3{width:260px;height:200px;left:260px;top:120px;background:#2A3D7A;filter:blur(80px)}
.au1{animation:auIn 2.4s .1s ease-out forwards,drift1 9s ease-in-out infinite alternate}
.au2{animation:auIn 2.4s .3s ease-out forwards,drift2 11s ease-in-out infinite alternate}
.au3{animation:auIn3 2.4s .5s ease-out forwards,drift1 13s ease-in-out infinite alternate-reverse}
@keyframes auIn{to{opacity:.55}} @keyframes auIn3{to{opacity:.35}}
@keyframes drift1{from{transform:translate(0,0)}to{transform:translate(60px,30px)}}
@keyframes drift2{from{transform:translate(0,0)}to{transform:translate(-50px,-30px)}}
.grain{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:22px 22px;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%)}
/* breath rings */
.rings{position:absolute;left:50%;top:112px;width:0;height:0}
.rings i{position:absolute;left:-60px;top:-60px;width:120px;height:120px;border-radius:32px;border:1.5px solid rgba(127,224,204,.55);opacity:0;animation:breath 3.2s cubic-bezier(.25,.6,.3,1) infinite}
.rings i:nth-child(2){animation-delay:1.07s;border-color:rgba(228,185,74,.45)}
.rings i:nth-child(3){animation-delay:2.14s}
@keyframes breath{0%{transform:scale(.9);opacity:0}15%{opacity:.7}100%{transform:scale(2.6);opacity:0;border-radius:60px}}
.rings{opacity:0;animation:fade .1s 1.6s forwards}
/* logo */
.logo{position:absolute;left:50%;top:112px;width:120px;height:120px;margin:-60px 0 0 -60px;filter:drop-shadow(0 14px 30px rgba(0,0,0,.45))}
.logo .bg{fill:#16264A;fill-opacity:0;animation:fillIn .9s 1.1s forwards}
.logo .fr{fill:none;stroke:#E4B94A;stroke-width:2.4;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s .2s cubic-bezier(.6,0,.3,1) forwards}
.logo .v,.logo .p,.logo .w{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.logo .v{stroke:#E4B94A;stroke-width:4.2;animation:draw .55s .9s ease-out forwards}
.logo .p{stroke:#fff;stroke-width:4.2;animation:draw .6s 1.25s ease-out forwards}
.logo .w{stroke:#7FE0CC;stroke-width:2.6;animation:draw .9s 1.6s ease-in-out forwards}
.logo .glow{fill:none;stroke:#E4B94A;stroke-width:2.4;opacity:0;filter:blur(3px);animation:pulse 2.6s 2.4s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fillIn{to{fill-opacity:1}}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.8}}
@keyframes fade{to{opacity:1}}
/* wordmark */
.wm{position:absolute;left:0;right:0;top:192px;text-align:center;font-size:48px;font-weight:600;letter-spacing:1px;line-height:1}
.wm span{display:inline-block;opacity:0;transform:translateY(16px);filter:blur(8px);animation:letter .7s cubic-bezier(.2,.8,.2,1) forwards}
.wm .g{color:#E4B94A}
@keyframes letter{to{opacity:1;transform:none;filter:blur(0)}}
.sheen{position:absolute;left:0;right:0;top:186px;height:62px;pointer-events:none;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);background-size:250% 100%;background-position:150% 0;mix-blend-mode:overlay;-webkit-mask:linear-gradient(#000,#000);animation:sheen 1.4s 3s ease-in-out forwards}
@keyframes sheen{to{background-position:-50% 0}}
.sub{position:absolute;left:0;right:0;top:252px;text-align:center;font-size:12.5px;color:#9FB3D1;text-transform:uppercase;letter-spacing:9px;opacity:0;animation:subIn 1.4s 2.5s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes subIn{to{opacity:1;letter-spacing:4px}}
/* monitor sweep */
canvas{position:absolute;left:0;top:278px;width:760px;height:64px;opacity:0;animation:fade 1s 1.9s forwards}
/* status + progress */
.st{position:absolute;left:56px;bottom:72px;font-size:12.5px;color:#9FB3D1;opacity:0;animation:fade .6s 1s forwards}
.pct{position:absolute;right:56px;bottom:72px;font-size:12.5px;color:#7FE0CC;font-variant-numeric:tabular-nums;opacity:0;animation:fade .6s 1s forwards}
.bar{position:absolute;left:56px;right:56px;bottom:62px;height:3px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;opacity:0;animation:fade .6s 1s forwards}
.bar i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,#3FB3A0,#7FE0CC 70%,#E4B94A);box-shadow:0 0 12px rgba(127,224,204,.7)}
.ft{position:absolute;left:56px;right:56px;bottom:16px;display:flex;justify-content:space-between;align-items:flex-end;font-size:11.5px;color:#6F82A6;opacity:0;animation:fade 1s 3.2s forwards}
.by{display:block;font-size:13px;color:#D5DEF0;margin-bottom:3px}.by b{color:#E4B94A;font-weight:600}
.dots{position:absolute;inset:0;pointer-events:none}
.dots b{position:absolute;bottom:-10px;width:4px;height:4px;border-radius:50%;background:#7FE0CC;opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.5}100%{transform:translateY(-460px);opacity:0}}
.out{animation:outFade .5s forwards}@keyframes outFade{to{opacity:0}}
</style></head><body>
<div class="au au1"></div><div class="au au2"></div><div class="au au3"></div>
<div class="grain"></div>
<div class="dots" id="dots"></div>
<div class="rings"><i></i><i></i><i></i></div>
<svg class="logo" viewBox="0 0 100 100">
  <rect class="bg" x="4" y="4" width="92" height="92" rx="24"/>
  <rect class="glow" x="4" y="4" width="92" height="92" rx="24"/>
  <rect class="fr" x="4" y="4" width="92" height="92" rx="24" pathLength="1"/>
  <path class="v" d="M24 22l11 26 11-26" pathLength="1"/>
  <path class="p" d="M54 22h9a8 8 0 0 1 0 16h-9v10" pathLength="1"/>
  <path class="w" d="M18 74h10v-10h14l4 10h8v-10h14l4 10h10" pathLength="1"/>
</svg>
<div class="wm" id="wm"></div>
<div class="sheen"></div>
<div class="sub">Mechanical Ventilation Simulator</div>
<canvas id="cv" width="1520" height="128"></canvas>
<div class="st"><span id="st">Starting…</span></div><div class="pct" id="pct">0%</div>
<div class="bar"><i id="bar"></i></div>
<div class="ft"><span><span class="by">Designed by <b>Youssef Mahrous Elmaadawy</b></span>Emergency &amp; Critical Care Technology · Delta University for Science and Technology</span><span id="ver"></span></div>
<script>
(function(){
  var q=new URLSearchParams(location.search).get('v'); document.getElementById('ver').textContent=q?('v'+q):'';
  /* wordmark letters */
  var wm=document.getElementById('wm'), word='VentaPro';
  for(var k=0;k<word.length;k++){var s=document.createElement('span');s.textContent=word[k];if(k>=5)s.className='g';s.style.animationDelay=(1.9+k*0.08)+'s';wm.appendChild(s);}
  /* floating breath particles */
  var d=document.getElementById('dots');
  for(var j=0;j<16;j++){var b=document.createElement('b');b.style.left=(Math.random()*100)+'%';var sz=2+Math.random()*3;b.style.width=b.style.height=sz+'px';b.style.animationDuration=(7+Math.random()*7)+'s';b.style.animationDelay=(Math.random()*6)+'s';if(j%4===0)b.style.background='#E4B94A';d.appendChild(b);}
  /* ventilator-style sweep: pressure (teal) + flow (gold, faint) */
  var cv=document.getElementById('cv'),c=cv.getContext('2d'),W=cv.width,H=cv.height,x=0,prevP=null,prevF=null,t=0,period=260;
  function pr(t){var ph=t%period, ti=period*0.38; if(ph<ti){return 1-Math.exp(-ph/9);} return Math.exp(-(ph-ti)/10);}
  function fl(t){var ph=t%period, ti=period*0.38; if(ph<ti){return Math.max(0,1-ph/ti)*Math.exp(-ph/60);} var e=ph-ti; return -Math.exp(-e/22);}
  function step(){
    for(var n=0;n<5;n++){
      c.clearRect(x,0,22,H);
      var yp=H*0.78-pr(t)*H*0.52, yf=H*0.62-fl(t)*H*0.26;
      if(prevP!==null&&x>0){
        c.lineCap='round';c.lineJoin='round';
        c.strokeStyle='rgba(228,185,74,.35)';c.lineWidth=2;c.shadowBlur=0;c.beginPath();c.moveTo(x-1,prevF);c.lineTo(x,yf);c.stroke();
        c.strokeStyle='#7FE0CC';c.lineWidth=3.2;c.shadowColor='rgba(127,224,204,.8)';c.shadowBlur=10;c.beginPath();c.moveTo(x-1,prevP);c.lineTo(x,yp);c.stroke();
      }
      prevP=yp;prevF=yf;x+=1;t+=1;
      if(x>=W){x=0;prevP=null;prevF=null;}
    }
    c.save();c.clearRect(x,0,22,H);c.restore();
    requestAnimationFrame(step);
  }
  setTimeout(function(){requestAnimationFrame(step);},1900);
  /* status + progress */
  var steps=['Loading lung mechanics model…','Calibrating ventilator modes…','Synchronising patient monitor…','Preparing blood-gas engine…','Connecting to the lab server…','Ready'];
  var st=document.getElementById('st'),pc=document.getElementById('pct'),bar=document.getElementById('bar'),i=0,p=0;
  setTimeout(function(){
    setInterval(function(){ if(i<steps.length){ st.style.opacity=0; setTimeout(function(){st.textContent=steps[i++];st.style.opacity=1;},150);} },800);
    setInterval(function(){ if(p<100){ p+=Math.max(1,Math.round((100-p)/26)); if(p>100)p=100; pc.textContent=p+'%'; bar.style.width=p+'%'; } },60);
  },1000);
  st.style.transition='opacity .15s';
})();
</script></body></html>
